[package]
name = "freyacn"
version = "0.1.0"
edition = "2024"
description = "The component CLI for Freya"
license = "MIT"
repository = "https://github.com/brightmadueke/freyacn-cli"

[[bin]]
name = "freyacn"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
colored = "3.1.1"
indicatif = "0.18.6"
reqwest = "0.13.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = "1.53.1"
toml = "1.1.6"
